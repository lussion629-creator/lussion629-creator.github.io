.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 36px 20px; }

r and type, and sort by deadline, amount or newest.", "Enter your profile (school type, semester, major field, income bracket, GPA, address, family circumstances) and each scholarship is marked Eligible · Check · Not eligible, with the reason.", "Deadline calendar, favorites, Google Calendar export and an ICS calendar feed.", "A 'What's new' view of added or changed scholarships."]}, {"h": "Platforms", "li": ["Web app (PWA): add it to the home screen to open it like an app, with the last data available offline.", "Android app (7.0+): ships with a copy of the database and alerts you when a saved scholarship closes within 3 days.", "Supports Hanyang University, Hanyang Women's University, Kangwon National University (Samcheok), Sogang University and Konkuk University, showing only what your school can apply for."]}, {"h": "How it runs", "li": ["GitHub Actions collects, stores and redeploys to GitHub Pages every 6 hours — no server costs.", "Boards that only render with JavaScript are read with a headless browser (Playwright); sites blocked by robots.txt are skipped.", "Can also run as a local Python server or in Docker."]}]}, {"t": "Basic PDF", "meta": "Web · Windows", "d": "A PDF reader and editor for reading, annotating, signing and organizing pages. Files never leave your device.", "result": "", "stack": ["JavaScript", "Electron", "Node.js"], "img": "@1", "link": "https://github.com/lussion629-creator/basic-pdf", "repo": "lussion629-creator/basic-pdf", "more": [{"h": "Reading", "li": ["Open several documents in tabs and navigate with page thumbnails, bookmarks and an annotation list.", "Search, single/continuous/two-page views, rotation, reading mode and a night mode that darkens the pages too."]}, {"h": "Annotate, edit, sign", "li": ["Highlight, underline, strikethrough, notes, pen, shapes and arrows, text boxes and stamps.", "Click existing text to edit it, insert images, and white out areas.", "Create a signature by drawing, typing or from an image, and fill in PDF form fields."]}, {"h": "Pages", "li": ["Drag to reorder, rotate, delete, insert blank pages or other PDFs, extract, split and merge.", "Page numbers, watermarks, PNG and text export, printing."]}, {"h": "Security & privacy", "li": ["Documents and signatures never go to a server. Both the app and the web version block outgoing network requests and never run scripts inside PDFs.", "The Windows app renders documents in a sandbox and encrypts signatures with the Windows account (DPAPI); the web version encrypts them with AES-GCM.", "The Windows app ships as an installer that works without an internet connection."]}], "web": "https://lussion629-creator.github.io/basic-pdf/"}, {"t": "PDF Workbench", "meta": "Web · Windows · Mac · Android", "d": "An app with 33 PDF tools that run entirely on your device, with no server. Files never leave the device.", "result": "Works without a server or API keys", "stack": ["JavaScript", "Go", "Android"], "img": "@2", "link": "https://github.com/lussion629-creator/pdf-workbench", "repo": "lussion629-creator/pdf-workbench", "more": [{"h": "What it does", "li": ["Runs 33 PDF tools entirely on the device, with no server. Results are saved to the PDF작업대 folder in Downloads.", "Also accepts Word, Excel and HTML files, stripping scripts and event attributes before loading them.", "When opened inside Claude, AI summary and translation are available; resident numbers, card numbers, phone numbers and emails are masked before sending and restored on the device."]}, {"h": "The 33 tools", "li": ["Organize: merge, split, remove or extract pages, reorder/rotate/insert, scan phone photos into a PDF", "Optimize: compress, repair damaged PDFs, OCR scanned documents", "Convert to PDF: JPG, Word, PowerPoint, Excel, HTML", "Convert from PDF: JPG, Word, PowerPoint, Excel, PDF/A (ISO archival standard)", "Edit: rotate, page numbers, watermarks, add text/images/shapes/pen, crop, fill or create forms", "Security: unlock, password-protect, sign and stamp, redact permanently, compare two PDFs", "Analyze: convert to Markdown, AI summary, AI translation"]}, {"h": "Security", "li": ["No server, database or API keys. The Android app has no internet permission.", "Third-party libraries are pinned and checked with SRI hashes, and a CSP only lets the app run its own files.", "PDFs are opened with settings that block the pdf.js vulnerability CVE-2024-4367, and SheetJS (no patched release) runs only in an isolated worker with a 60-second limit.", "The desktop app's local server only accepts requests from its own address on 127.0.0.1."]}, {"h": "Engineering", "li": ["Automated Playwright tests run all 33 tools on real files.", "Every commit is checked for secret files and API keys, every push is checked again on GitHub, and Dependabot reports vulnerable libraries weekly.", "The desktop launcher uses only Go's standard library, and the Android app is built without Gradle."]}], "web": "https://lussion629-creator.github.io/pdf-workbench/"}, {"t": "Novel Writer", "meta": "Web (PWA) · Windows · Mac", "d": "A word processor for novelists, with auto-save, version comparison, a revision mode and manuscript-page counting.", "result": "", "stack": ["JavaScript", "Vite", "Electron", "Node.js"], "img": "@3", "link": "https://github.com/lussion629-creator/SOSUL-CHANGJAK-PROGRAM", "repo": "lussion629-creator/SOSUL-CHANGJAK-PROGRAM", "web": "https://lussion629-creator.github.io/SOSUL-CHANGJAK-PROGRAM/", "more": [{"h": "Writing", "li": ["Word-like formatting (bold, italics, fonts, colors, highlights, alignment, headings, quotes, scene breaks) with Font and Paragraph dialogs.", "Letter and line spacing in Hangul (%) or Word (pt) style, and a page view showing paper size, margins and page numbers. The default template is a novel-size A5 page.", "Exports to Hangul (hwpx), Word (docx) and PDF, and opens hwp, doc and PDF files."]}, {"h": "Saving & history", "li": ["Saves on the device 5 seconds after you stop typing, and again when the window closes.", "Builds up versions every few minutes and summarizes which paragraphs changed and how. Pick a date to restore.", "Keeps the previous draft before large deletions or replace-all, and keeps deleted chapters and works in a trash for 30 days.", "Tracks a copy/paste history and today's word count, counting typed and pasted text separately."]}, {"h": "Revision", "li": ["Revision mode puts an earlier version next to the current draft, with additions in green and deletions in red.", "A spelling, spacing and punctuation checker, a one-click manuscript cleanup, and an optional AI spell check.", "Inline annotations (index, suggestion, citation, intent); others' suggestions can be accepted or rejected in one click.", "A character map showing how often each character and place appears per chapter, plus per-chapter word targets."]}, {"h": "AI read-aloud", "li": ["Reads the manuscript in Gemini voices: choose from 30 voices and give each character a different voice.", "Set speed and tone, save a chapter or the whole work as a WAV file, and see this month's usage and estimated cost."]}, {"h": "Platforms & privacy", "li": ["Works in desktop and phone browsers as a web app; the Windows and macOS installers update themselves.", "Manuscripts stay on your device and, if you connect them, your own sync server or Google Drive — which is limited to files this app created."]}]}]}, {"title": "Awards", "type": "list", "items": [{"t": "Semester Academic Excellence Award", "sub": "Spring 2026", "d": "Hanyang University · Jun 22, 2026"}, {"t": "Semester Academic Excellence Award", "sub": "Fall 2025", "d": "Hanyang University · Dec 20, 2025"}, {"t": "Semester Academic Excellence Award", "sub": "Spring 2025", "d": "Hanyang University · Jun 23, 2025"}, {"t": "Semester Academic Excellence Award", "sub": "Fall 2024", "d": "Hanyang University · Dec 21, 2024"}, {"t": "Semester Academic Excellence Award", "sub": "Spring 2024", "d": "Hanyang University · Jun 22, 2024"}, {"t": "Semester Academic Excelle function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text; // 내용은 항상 textContent 로만 넣습니다 (HTML 해석 없음)
  return n;
}

function photo(src, ratio, alt, cls) {
  var box = el("div", "photo" + (cls ? " " + cls : ""));
  box.style.aspectRatio = ratio || "4 / 3";
  box.innerHTML = ICON; // 고정 아이콘만 사용
  if (src && src.charAt(0) === "@") src = IMGS[+src.slice(1)] || "";
  if (src) {
    var img = document.createElement("img");
    img.alt = alt || "";
    img.decoding = "async";
    img.addEventListener("load", function () { img.classList.add("on"); });
    img.src = src;
    if (img.complete && img.naturalWidth) img.classList.add("on");
    box.appendChild(img);
  }
  return box;
}

function safeLink(a, url) {
  // http(s) 주소만 링크로 허용 (javascript: 같은 주소 차단)
  if (!url || !/^https?:\/\//i.test(url)) return false;
  a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
  return true;
}

var io = null;
var openSet = {}; // 펼친 카드는 언어를 바꿔도 펼친 채로 둡니다
var CHEV = '<svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg>';

function renderList(items, ui) {
  var list = el("div", "list");
  items.forEach(function (it) {
    var isLink = !!it.link && /^https?:\/\//i.test(it.link);
    var row = el(isLink ? "a" : "div", "row");
    if (isLink) safeLink(row, it.link);
    var t = el("span", "t", it.t);
    if (it.sub) t.appendChild(el("small", null, it.sub));
    row.appendChild(t);
    var d = el("span", "d");
    if (it.copy) {
      var b = el("button", "copy", it.d);
      b.type = "button";
      b.addEventListener("click", function () {
        function done() { b.textContent = ui.copied; setTimeout(function () { b.textContent = it.d; }, 1400); }
        function sel() {
          var r = document.createRange(); r.selectNodeContents(b);
          var g = window.getSelection(); g.removeAllRanges(); g.addRange(r);
        }
        try { navigator.clipboard.writeText(it.d).then(done, sel); } catch (e) { sel(); }
      });
      d.appendChild(b);
    } else {
      d.appendChild(el("span", null, it.d));
    }
    if (isLink) d.appendChild(el("span", "arrow", "↗"));
    row.appendChild(d);
    list.appendChild(row);
  });
  return list;
}

// 다운로드 주소: dl 에 직접 주소를 넣거나, repo("계정/저장소")만 넣으면 GitHub 의 "최신 릴리스" 주소를 씁니다.
// 새 버전을 릴리스로 올리기만 하면 이 페이지를 고치지 않아도 항상 최신 버전이 내려갑니다.
function downloadUrl(it) {
  if (it.dl && /^https:\/\//i.test(it.dl)) return it.dl;
  if (it.repo && /^[\w.\-]+\/[\w.\-]+$/.test(it.repo)) return "https://github.com/" + it.repo + "/releases/latest";
  return "";
}

function renderCards(items, ui, si) {
  var wrap = el("div", "cards");
  items.forEach(function (it, idx) {
    var isLink = !!it.link && /^https?:\/\//i.test(it.link);
    var card = el("div", "card" + (isLink ? " lk" : ""));
    var top = el(isLink ? "a" : "div", "top");
    if (isLink) safeLink(top, it.link);
    top.appendChild(photo(it.img, "4 / 3", it.t));
    var h = el("h3");
    h.appendChild(el("span", null, it.t));
    if (isLink) h.appendChild(el("span", "arrow", "↗"));
    top.appendChild(h);
    card.appendChild(top);
    // 카드마다 같은 순서·같은 칸 수로 넣어 옆 카드와 줄이 맞게 합니다 (빈 항목은 빈 칸)
    function slot() { return el("div", "slot"); }
    card.appendChild(it.meta ? el("div", "meta", it.meta) : slot());
    card.appendChild(it.d ? el("p", "desc", it.d) : slot());
    card.appendChild(it.result ? el("p", "result", it.result) : slot());
    if (it.stack && it.stack.length) {
      var st = el("div", "stack");
      it.stack.forEach(function (s) { st.appendChild(el("span", null, s)); });
      card.appendChild(st);
    } else card.appendChild(slot());
    var dlUrl = downloadUrl(it);
    var webOk = !!it.web && /^https:\/\//i.test(it.web);
    if (dlUrl || webOk) {
      var acts = el("div", "acts");
      if (dlUrl) {
        var g = el("a", "get", (ui && ui.appDownload ? ui.appDownload : "Download") + " ↓");
        safeLink(g, dlUrl);
        acts.appendChild(g);
      }
      if (webOk) {
        var w = el("a", "get", (ui && ui.appWeb ? ui.appWeb : "Web") + " ↗");
        safeLink(w, it.web);
        acts.appendChild(w);
      }
      card.appendChild(acts);
    } else card.appendChild(slot());
    if (it.more && it.more.length) {
      var key = si + "-" + idx;
      var tg = el("button", "more-btn");
      tg.type = "button";
      var lab = el("span");
      tg.appendChild(lab);
      tg.insertAdjacentHTML("beforeend", CHEV); // 고정 아이콘만 사용
      var panel = el("div", "more");
      panel.id = "more-" + key;
      tg.setAttribute("aria-controls", panel.id);
      var inner = el("div", "more-in");
      var body = el("div", "more-body");
      it.more.forEach(function (gr, k) {
        var g = el("div", "g");
        g.style.setProperty("--k", k);
        g.appendChild(el("h4", null, gr.h));
        var ul = el("ul");
        (gr.li || []).forEach(function (x) { ul.appendChild(el("li", null, x)); });
        g.appendChild(ul);
        body.appendChild(g);
      });
      inner.appendChild(body);
      panel.appendChild(inner);
      var set = (function (card, tg, lab, panel, key) {
        return function (open) {
          openSet[key] = open;
          card.classList.toggle("open", open);
          tg.setAttribute("aria-expanded", String(open));
          lab.textContent = open ? ui.less : ui.more;
          panel.setAttribute("aria-hidden", String(!open));
          if ("inert" in panel) panel.inert = !open;
        };
      })(card, tg, lab, panel, key);
      card._setOpen = set;
      set(!!openSet[key]);
      tg.addEventListener("click", function () {
        set(!card.classList.contains("open"));
        if (wrap._sync) wrap._sync();
      });
      card.appendChild(tg);
      card.appendChild(panel);
    } else { card.appendChild(slot()); card.appendChild(slot()); }
    wrap.appendChild(card);
  });
  return wrap;
}

function renderGallery(items) {
  var wrap = el("div", "gallery");
  items.forEach(function (it) {
    var fig = el("figure");
    fig.appendChild(photo(it.img, "1 / 1", it.c));
    if (it.c) fig.appendChild(el("figcaption", null, it.c));
    wrap.appendChild(fig);
  });
  return wrap;
}

function pdfKB(l) { return Math.max(1, Math.round((PDFS[l] || "").length * 0.75 / 1024)); }

function render() {
  var T = DATA[lang], ui = T.ui;
  rootEl.lang = lang;
  document.getElementById("nav-name").textContent = T.profile.name;
  document.getElementById("name").textContent = T.profile.name;
  var roleEl = document.getElementById("role");
  roleEl.textContent = T.profile.role || "";
  roleEl.hidden = !T.profile.role;
  var sample = document.getElementById("sample");
  sample.textContent = ui.sample || "";
  sample.hidden = !ui.sample;
  document.getElementById("mode").setAttribute("aria-label", ui.modeLabel);
  var langBox = document.getElementById("lang");
  langBox.setAttribute("aria-label", ui.langLabel);
  langBox.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-l") === lang)); });
  document.getElementById("dl-label").textContent = ui.pdfButton;
  document.getElementById("dl-note").textContent = STANDALONE ? ui.pdfSub : ui.pdfSub + " · " + pdfKB(lang) + " KB";

  if (io) io.disconnect();
  root.textContent = "";
  navLinks.textContent = "";
  T.sections.forEach(function (s, i) {
    var sec = el("section");
    sec.id = "sec-" + i;
    sec.style.setProperty("--i", i + 1);
    var hd = el("div", "sec-hd");
    hd.appendChild(el("h2", null, s.title));
    sec.appendChild(hd);
    if (s.photo) sec.appendChild(photo(s.photo.img, s.photo.ratio, s.title, "wide"));
    if (s.type === "cards") {
      var cw = renderCards(s.items, ui, i);
      sec.appendChild(cw);
      var hasMore = cw.querySelectorAll(".more-btn").length > 0;
      if (hasMore) {
        var all = el("button", "more-all");
        all.type = "button";
        var allLab = el("span");
        all.appendChild(allLab);
        all.insertAdjacentHTML("beforeend", CHEV);
        hd.appendChild(all);
        cw._sync = (function (cw, all, allLab) {
          return function () {
            var cs = cw.querySelectorAll(".card"), n = 0, o = 0;
            cs.forEach(function (c) { if (c._setOpen) { n++; if (c.classList.contains("open")) o++; } });
            var every = n > 0 && o === n;
            all.setAttribute("aria-expanded", String(every));
            allLab.textContent = every ? ui.allLess : ui.allMore;
          };
        })(cw, all, allLab);
        all.addEventListener("click", (function (cw, all) {
          return function () {
            var open = all.getAttribute("aria-expanded") !== "true";
            cw.querySelectorAll(".card").forEach(function (c) { if (c._setOpen) c._setOpen(open); });
            cw._sync();
          };
        })(cw, all));
        cw._sync();
      }
    }
    else if (s.type === "gallery") sec.appendChild(renderGallery(s.items));
    else sec.appendChild(renderList(s.items, ui));
    root.appendChild(sec);

    var li = el("li");
    var a = el("a", null, s.title);
    a.href = "#sec-" + i;
    a.addEventListener("click", function (e) {
      e.preventDefault();
      sec.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    li.appendChild(a);
    navLinks.appendChild(li);
  });

  // 지금 보고 있는 카테고리를 내비에서 표시
  if ("IntersectionObserver" in window) {
    var links = navLinks.querySelectorAll("a");
    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        var idx = Number(en.target.id.replace("sec-", ""));
        links.forEach(function (l, k) { l.setAttribute("aria-current", String(k === idx)); });
      });
    }, { rootMargin: "-40% 0px -55% 0px" });
    root.querySelectorAll("section").forEach(function (s) { io.observe(s); });
  }
}

// 언어 선택: 기기 언어를 따르고, 한 번 고르면 기억합니다. 바뀔 때는 부드럽게 페이드합니다.
function detectLang() {
  try {
    var s = localStorage.getItem("lang");
    if (s === "ko" || s === "en") return s;
  } catch (e) {}
  return (navigator.language || "").toLowerCase().indexOf("ko") === 0 ? "ko" : "en";
}
var page = document.getElementById("page");
function setLang(l) {
  if (l === lang || !DATA[l]) return;
  lang = l;
  try { localStorage.setItem("lang", l); } catch (e) {}
  page.classList.add("fade");
  setTimeout(function () { render(); page.classList.remove("fade"); }, 260);
}
document.getElementById("lang").addEventListener("click", function (e) {
  var b = e.target.closest("button[data-l]");
  if (b) setLang(b.getAttribute("data-l"));
});

// 라이트/다크 전환: 처음에는 기기 설정을 따르고, 한 번 누르면 그 선택을 기억합니다.
try {
  var savedTheme = localStorage.getItem("theme");
  if (savedTheme === "light" || savedTheme === "dark") rootEl.setAttribute("data-theme", savedTheme);
} catch (e) {}
document.getElementById("mode").addEventListener("click", function () {
  var cur = rootEl.getAttribute("data-theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  var next = cur === "dark" ? "light" : "dark";
  rootEl.setAttribute("data-theme", next);
  try { localStorage.setItem("theme", next); } catch (e) {}
});

// PDF 다운로드: 저장은 보는 사람이 확인해야 진행됩니다. 이 기능을 쓸 수 없는 화면에서는 버튼을 숨깁니다.
var dlBtn = document.getElementById("dl");
var dlLabel = document.getElementById("dl-label");
var dlApi = null;
try {
  if (window.claude && window.claude.use) {
    window.claude.use("downloads").then(function (d) {
      dlApi = d;
      document.getElementById("end").hidden = !d;
    }, function () {});
  }
} catch (e) {}
if (STANDALONE) document.getElementById("end").hidden = false;
function flash(text) {
  dlLabel.textContent = text;
  setTimeout(function () { dlBtn.disabled = false; dlLabel.textContent = DATA[lang].ui.pdfButton; }, 1800);
}
dlBtn.addEventListener("click", function () {
  if (!dlApi) { if (STANDALONE) window.print(); return; }
  var ui = DATA[lang].ui;
  var b64 = PDFS[lang];
  if (!b64) return;
  var bin = atob(b64), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  dlBtn.disabled = true;
  dlApi.save({ filename: ui.pdfName, data: new Blob([arr], { type: "application/pdf" }) }).then(
    function () { flash(ui.pdfSaved); },
    function (err) {
      if (err && err.code === "declined") { dlBtn.disabled = false; return; }
      flash(ui.pdfFail);
    }
  );
});

lang = detectLang();
render();
</script>
</body></html>
